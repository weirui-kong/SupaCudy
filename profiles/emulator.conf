# QEMU virtual machine (arm64) for local development and the emulator tests.
# Not a router image: see docs/emulator.md.
TARGET=armsr
SUBTARGET=armv8
PROFILE=generic
# emulator/files plus a generated SSH key, staged by scripts/emulator.sh build.
FILES=out/emulator/overlay
DEVICE_PACKAGES="
	kmod-mac80211-hwsim
	-wpad-basic-mbedtls
	wpad-mbedtls
	iw-full
	ip-full
	kmod-veth
"
