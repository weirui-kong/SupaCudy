# Cudy TR3000 v1, 256MB SPI NAND, stock U-Boot layout.
PROFILE=cudy_tr3000-256mb-v1
# The full wpad, so the repeater can join WPA2-Enterprise (802.1X) networks.
# The OpenSSL build because the mbedtls one cannot check the server
# certificate (mbedtls 3.6 wants a host name wpa_supplicant never sets);
# libopenssl3 is in the image already for openssl-util.
DEVICE_PACKAGES="
	-wpad-basic-mbedtls
	wpad-openssl
"
