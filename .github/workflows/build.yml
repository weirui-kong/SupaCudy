name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [cudy-tr3000-v1, cudy-tr3000-256mb-v1]
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        run: scripts/build-packages.sh

      - name: Smoke test packages
        run: scripts/smoke-test.sh

      - name: Build image
        run: scripts/build-image.sh ${{ matrix.profile }}

      - uses: actions/upload-artifact@v4
        with:
          name: supacudy-${{ matrix.profile }}
          path: |
            out/packages/*.ipk
            out/images/${{ matrix.profile }}/*
