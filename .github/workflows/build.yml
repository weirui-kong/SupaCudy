name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run all tests
        run: scripts/test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            out/test-logs/
            web/playwright-report/

  image:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [cudy-tr3000-v1, cudy-tr3000-256mb-v1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build packages
        run: scripts/build-packages.sh

      - name: Build image
        run: scripts/build-image.sh ${{ matrix.profile }}

      - uses: actions/upload-artifact@v4
        with:
          name: supacudy-${{ matrix.profile }}
          path: |
            out/packages/*.ipk
            out/images/${{ matrix.profile }}/*
