<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupaCudy</title>
<style>
	:root {
		--bg: #f5f6f8; --card: #fff; --text: #1d2129; --muted: #6b7280;
		--accent: #2563eb; --danger: #dc2626; --border: #e5e7eb;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #111318; --card: #1b1e25; --text: #e6e8eb; --muted: #9aa1ab;
			--accent: #60a5fa; --danger: #f87171; --border: #2b2f38;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
		padding: 16px; background: var(--bg); color: var(--text);
		font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
	}
	.card {
		width: 100%; max-width: 380px; padding: 24px; border-radius: 14px;
		background: var(--card); border: 1px solid var(--border);
	}
	h1 { margin: 0 0 4px; font-size: 22px; }
	p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
	label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
	input {
		width: 100%; padding: 10px 12px; margin-bottom: 14px; border-radius: 8px; font: inherit;
		border: 1px solid var(--border); background: var(--bg); color: var(--text);
	}
	button {
		width: 100%; padding: 11px; border: 0; border-radius: 8px; font: inherit; font-weight: 600;
		background: var(--accent); color: #fff; cursor: pointer;
	}
	button.link { background: none; color: var(--accent); margin-top: 8px; font-weight: 400; }
	.error { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 10px; }
	dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 16px; }
	dt { color: var(--muted); }
	dd { margin: 0; word-break: break-all; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
	<h1>SupaCudy</h1>
	<p class="sub">占位页面 · 用于验证登录和 API 链路</p>

	<form id="login">
		<label for="password">管理密码（root）</label>
		<input id="password" type="password" autocomplete="current-password" autofocus>
		<button type="submit">登录</button>
		<div class="error" id="login-error"></div>
	</form>

	<section id="info" hidden>
		<dl id="info-list"></dl>
		<button type="button" id="logout" class="link">退出登录</button>
		<div class="error" id="info-error"></div>
	</section>
</main>

<script>
	const ANON = '00000000000000000000000000000000';
	const SESSION_KEY = 'supacudy.session';
	const DENIED = '没有权限或会话已过期';

	let rpcId = 0;

	// One ubus call over uhttpd's JSON-RPC endpoint.
	async function ubus(session, object, method, args = {}) {
		const res = await fetch('/ubus', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				jsonrpc: '2.0', id: ++rpcId, method: 'call',
				params: [session, object, method, args]
			})
		});
		const body = await res.json();
		// rpcd reports "permission denied" as ubus status 6 or JSON-RPC error -32002.
		if (body.error)
			throw new Error(body.error.code === -32002 ? DENIED : body.error.message);
		const [code, data] = body.result;
		if (code !== 0)
			throw new Error(code === 6 ? DENIED : `ubus 错误 ${code}`);
		return data || {};
	}

	function getSession() {
		try { return sessionStorage.getItem(SESSION_KEY); } catch { return null; }
	}

	function setSession(id) {
		try {
			if (id) sessionStorage.setItem(SESSION_KEY, id);
			else sessionStorage.removeItem(SESSION_KEY);
		} catch {}
	}

	const $ = (id) => document.getElementById(id);

	function showLogin(message = '') {
		$('info').hidden = true;
		$('login').hidden = false;
		$('login-error').textContent = message;
	}

	async function showInfo(session) {
		try {
			const info = await ubus(session, 'supacudy', 'info');
			// system.* comes from procd; treat it as optional so the page
			// still works where procd is absent (e.g. the smoke-test container).
			const sys = await ubus(session, 'system', 'info').catch(() => null);
			const rows = [
				['设备', info.model],
				['板型', info.board],
				['OpenWrt', `${info.openwrt} (${info.revision})`],
				['SupaCudy', info.version],
				['运行时间', sys && `${Math.floor(sys.uptime / 60)} 分钟`],
				['可用内存', sys && `${Math.round(sys.memory.available / 1048576)} MB`]
			];
			$('info-list').replaceChildren(...rows.flatMap(([k, v]) => {
				const dt = document.createElement('dt');
				const dd = document.createElement('dd');
				dt.textContent = k;
				dd.textContent = v ?? '—';
				return [dt, dd];
			}));
			$('login').hidden = true;
			$('info').hidden = false;
		} catch (e) {
			setSession(null);
			showLogin(e.message);
		}
	}

	$('login').addEventListener('submit', async (ev) => {
		ev.preventDefault();
		$('login-error').textContent = '';
		try {
			const res = await ubus(ANON, 'session', 'login', {
				username: 'root', password: $('password').value
			});
			setSession(res.ubus_rpc_session);
			$('password').value = '';
			await showInfo(res.ubus_rpc_session);
		} catch (e) {
			showLogin(e.message === DENIED ? '密码错误' : e.message);
		}
	});

	$('logout').addEventListener('click', async () => {
		const session = getSession();
		setSession(null);
		showLogin();
		if (session)
			ubus(session, 'session', 'destroy').catch(() => {});
	});

	const saved = getSession();
	if (saved) showInfo(saved);
</script>
</body>
</html>
